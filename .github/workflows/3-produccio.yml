name: 3 · Produción de posts
on:
  schedule:
    - cron: "*/15 6-21 * * *"
  workflow_dispatch:
concurrency: produccio
permissions:
  contents: write
jobs:
  produccio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p images && python produccio.py
      - name: Garda as imaxes no repositorio
        run: |
          git config user.name "valdeorras-hoxe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add images/
          git diff --cached --quiet || (git commit -m "Novas imaxes" && git push)
